name: Dev OpenCode follow-up fix

'on':
  push:
    branches:
      - 'dev/opencode-desktop-upgrade-v2'
    paths:
      - '.github/workflows/dev-opencode-followup-fix.yml'

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/opencode-desktop-upgrade-v2
      - name: Apply patch
        run: python3 scripts/dev_opencode_followup_fix.py
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Run focused Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml install_source_classification
      - name: Commit validated patch
        run: |
          rm scripts/dev_opencode_followup_fix.py
          rm .github/workflows/dev-opencode-followup-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/commands/misc.rs scripts/dev_opencode_followup_fix.py .github/workflows/dev-opencode-followup-fix.yml
          git commit -m 'fix(apps): tighten OpenCode Desktop source detection'
          git push origin HEAD:dev/opencode-desktop-upgrade-v2
