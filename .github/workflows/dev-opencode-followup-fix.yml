name: Dev OpenCode follow-up fix

'on':
  push:
    branches:
      - 'dev/opencode-desktop-upgrade-v2'
    paths:
      - '.github/workflows/dev-opencode-followup-fix.yml'

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/opencode-desktop-upgrade-v2
      - name: Apply patches
        run: |
          python3 scripts/dev_opencode_followup_fix.py
          python3 scripts/dev_install_reports_fix.py
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Run focused Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml install_source_classification
      - name: Set up frontend
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Check frontend
        run: |
          pnpm typecheck
          pnpm format:check
          pnpm exec vitest run tests/components/AppsPage.test.tsx
      - name: Commit validated patch
        run: |
          rm scripts/dev_opencode_followup_fix.py scripts/dev_install_reports_fix.py
          rm .github/workflows/dev-opencode-followup-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/commands/misc.rs src/components/apps/useToolManagement.ts tests/components/AppsPage.test.tsx scripts/dev_opencode_followup_fix.py scripts/dev_install_reports_fix.py .github/workflows/dev-opencode-followup-fix.yml
          git commit -m 'fix(apps): harden OpenCode Desktop update handling'
          git push origin HEAD:dev/opencode-desktop-upgrade-v2
