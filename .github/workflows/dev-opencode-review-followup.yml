name: Dev OpenCode review follow-up

on:
  push:
    branches:
      - dev/opencode-desktop-upgrade-v2
    paths:
      - .github/workflows/dev-opencode-review-followup.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/opencode-desktop-upgrade-v2

      - name: Apply review follow-up
        run: python3 scripts/dev_opencode_review_followup.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frontend follow-up
        run: |
          pnpm format:check
          pnpm typecheck
          pnpm exec vitest run tests/components/AppsPage.test.tsx tests/config/toolManagementLocales.test.ts

      - name: Commit validated patch
        shell: bash
        run: |
          rm .github/workflows/dev-opencode-review-followup.yml scripts/dev_opencode_review_followup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/apps/AppsPage.tsx tests/components/AppsPage.test.tsx tests/config/toolManagementLocales.test.ts src/i18n/locales/en.json src/i18n/locales/zh.json src/i18n/locales/zh-TW.json src/i18n/locales/ja.json src/i18n/locales/tr.json .github/workflows/dev-opencode-review-followup.yml scripts/dev_opencode_review_followup.py
          git commit -m "fix(apps): explain unmanaged OpenCode updates"
          git push origin HEAD:dev/opencode-desktop-upgrade-v2
