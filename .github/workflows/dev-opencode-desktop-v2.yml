name: Dev OpenCode Desktop follow-up

on:
  push:
    branches:
      - dev/opencode-desktop-upgrade-v2

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply focused patch
        run: python .github/apply-opencode-desktop-v2.py

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate focused frontend changes
        run: |
          pnpm exec prettier --write src/components/apps/useToolManagement.ts src/components/apps/AppsPage.tsx tests/components/AppsPage.test.tsx
          pnpm exec prettier --check src/components/apps/useToolManagement.ts src/components/apps/AppsPage.tsx tests/components/AppsPage.test.tsx
          pnpm typecheck
          pnpm exec vitest run tests/components/AppsPage.test.tsx

      - name: Validate Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Commit validated fork-only development patch
        run: |
          rm .github/apply-opencode-desktop-v2.py .github/workflows/dev-opencode-desktop-v2.yml
          git config user.name teddyli18000
          git config user.email 244657365+teddyli18000@users.noreply.github.com
          git add -A
          git commit -m "fix(apps): finish OpenCode Desktop upgrade UX"
          git push origin HEAD:dev/opencode-desktop-upgrade-v2
